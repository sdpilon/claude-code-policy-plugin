name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-format-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Verify lock file matches pyproject.toml
        run: uv lock --check

      - name: Install locked dev tools
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Markdown lint
        run: git ls-files -z '*.md' ':!.specify/**' ':!.claude/**' ':!.claude-plugin/**' | xargs -0 uv run pymarkdown scan

      - name: Markdown format check
        run: |
          md_files() { git ls-files -z '*.md' ':!.specify/**' ':!.claude/**' ':!.claude-plugin/**'; }
          before=$(md_files | xargs -0 git hash-object)
          md_files | xargs -0 uv run pymarkdown fix
          if [ "$before" != "$(md_files | xargs -0 git hash-object)" ]; then
            echo "Markdown is not formatted; run pymarkdown fix locally." >&2
            exit 1
          fi

      - name: Shell lint
        run: git ls-files -z '*.sh' ':!.specify/**' ':!.claude/**' ':!.claude-plugin/**' | xargs -0 uv run shellcheck

      - name: Shell format check
        run: git ls-files -z '*.sh' ':!.specify/**' ':!.claude/**' ':!.claude-plugin/**' | xargs -0 uv run shfmt -i 2 -d

      - name: Unit tests
        run: uv run python -m unittest discover -s tests
